; Réglages PHP de PRODUCTION (image "production" seulement, voir le Dockerfile).
; Ils s'ajoutent à php.ini-production et à souk.ini.

; ----- Erreurs -----
; Jamais affichées au visiteur : un message d'erreur révèle des chemins, des
; requêtes SQL, parfois des identifiants. Elles vont dans le journal d'Apache,
; lisible avec "docker compose -f docker-compose.prod.yml logs php".
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; ----- OPcache -----
opcache.enable = 1
opcache.memory_consumption = 64
; Le code est figé dans l'image : inutile de vérifier à chaque requête si un
; fichier a changé. Une mise à jour = une nouvelle image (deploy.sh).
opcache.validate_timestamps = 0

; ----- Sessions -----
; Ceinture et bretelles : app/Core/Session.php pose déjà le flag Secure grâce à
; SESSION_COOKIE_SECURE=1 (fixé dans docker-compose.prod.yml)
session.cookie_secure = 1
