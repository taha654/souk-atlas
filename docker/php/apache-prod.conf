# Apache en production, derrière le reverse proxy Caddy.
#
# Problème : c'est Caddy qui ouvre la connexion TCP vers Apache. Sans réglage,
# REMOTE_ADDR vaut l'IP de Caddy pour TOUS les visiteurs, et la limite de
# 20 échecs de connexion par IP (app/config.php) bloquerait tout le site
# au premier petit malin.
#
# Solution : mod_remoteip lit l'en-tête X-Forwarded-For (écrit par Caddy) et
# remet la vraie IP du visiteur dans REMOTE_ADDR, MAIS seulement si la
# connexion vient du réseau de Caddy. Un visiteur ne peut pas parler à Apache
# directement (aucun port publié), et Caddy remplace l'en-tête X-Forwarded-For
# envoyé par un visiteur : impossible de se faire passer pour une autre IP.
# Le code PHP ne change pas : il continue de lire REMOTE_ADDR (app/Core/Request.php).
RemoteIPHeader X-Forwarded-For
# Variable d'environnement fixée dans docker-compose.prod.yml (réseau "web")
RemoteIPInternalProxy ${RESEAU_PROXY}

# Le journal d'accès affiche la vraie IP (%a) au lieu de celle de Caddy (%h)
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
