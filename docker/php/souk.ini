; Configuration PHP de Souk Atlas (copiée dans conf.d par le Dockerfile)

date.timezone = Africa/Casablanca
; Ne pas annoncer la version de PHP dans les en-têtes HTTP
expose_php = Off

; ----- Sessions -----
; Mode strict : PHP refuse un identifiant de session qu'il n'a pas créé lui-même.
; Sans lui, un attaquant peut imposer un identifiant à sa victime (fixation de session).
session.use_strict_mode = 1
; L'identifiant ne passe QUE par un cookie, jamais dans l'URL (copiable, visible dans l'historique)
session.use_only_cookies = 1
session.use_trans_sid = 0
; Cookie illisible par JavaScript : une faille XSS ne peut pas le voler
session.cookie_httponly = 1
; Le cookie n'accompagne pas les requêtes POST venues d'autres sites
session.cookie_samesite = Lax
; Le flag Secure et la durée d'inactivité sont réglés dans app/Core/Session.php,
; car ils dépendent de la requête (HTTPS ou non) et du fichier .env
