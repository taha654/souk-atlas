# Apache : seul public/ est servi, et toute URL qui ne correspond pas à un
# fichier réel (CSS, JS, image) est confiée au contrôleur frontal index.php.
<Directory /var/www/html/public>
    # FallbackResource (mod_dir) : plus simple qu'une règle mod_rewrite pour ce besoin
    FallbackResource /index.php
    # Pas de liste des fichiers d'un dossier sans index
    Options -Indexes
</Directory>

# Ne pas annoncer la version d'Apache
ServerTokens Prod
ServerSignature Off

# Au plus 20 processus Apache, donc au plus 20 connexions Oracle persistantes
# (oci_pconnect) : bien en dessous de la limite de la base (PROCESSES = 200).
# La valeur par défaut (150) pourrait épuiser les processus d'Oracle.
<IfModule mpm_prefork_module>
    MaxRequestWorkers 20
</IfModule>

# Dossier des fichiers envoyés par les utilisateurs : on ne doit JAMAIS y
# exécuter quoi que ce soit, même si un fichier malveillant y était déposé.
<Directory /var/www/html/public/uploads>
    # PHP désactivé dans ce dossier
    php_admin_flag engine off
    Options -Indexes -ExecCGI
    # Un .php (ou équivalent) n'est même pas servi : 403
    <FilesMatch "\.(php|phtml|phar|pht|phps|cgi|pl|py|sh)$">
        Require all denied
    </FilesMatch>
    # Le navigateur respecte le type déclaré (pas de "devinette" de contenu)
    Header set X-Content-Type-Options "nosniff"
</Directory>
